[project]
name = "swarm-collusion-sprint"
version = "0.1.0"
description = "Local Colosseum experiment workspace for minority influence and defence"
requires-python = ">=3.11,<3.12"
dependencies = [
  "terrarium-agents[providers,science,plots]==0.2.1",
  "openai>=2.0,<3",
  "python-dotenv>=1.2.1,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
